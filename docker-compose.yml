services:
  n8n:
    image: n8nio/n8n

    ports:
      - "5678:5678"

    environment:
      - TZ=${TZ}

      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https

      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=false

    volumes:
      - /tmp/.n8n:/home/node/.n8n