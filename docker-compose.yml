services:
  n8n:
    image: n8nio/n8n

    ports:
      - "5678:5678"

    environment:
      - TZ=${TZ}

      - DB_TYPE=sqlite
      - DB_SQLITE_POOL_SIZE=1

      - NODE_OPTIONS=--max-old-space-size=384

      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https

    volumes:
      - /tmp/.n8n:/home/node/.n8n